<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5FA">
<title>Quiz Arena</title>
<meta name="description" content="Host a live buzzer quiz. Players join with a code and a name, and every reveal names the fastest correct answer with the exact seconds it took.">
<style>
/* ============================================================
   Quiz Arena
   A daylit scoreboard: cool paper ground, one confident indigo,
   amber reserved for the thing this app exists to show — who was
   fastest. Archivo carries headings and figures, IBM Plex Sans the
   operational text, IBM Plex Mono the measured times.
   ============================================================ */
:root{
  /* ground & ink — neutrals carry a faint indigo bias so they sit
     with the accent rather than under it */
  --bg:#F1F2F8;
  --bg-tint:#E8E9F5;
  --surface:#FFFFFF;
  --surface-2:#F7F8FC;
  --sunken:#EEF0F7;
  --ink:#16172B;
  --ink-2:#41435C;
  --muted:#63668A;
  --faint:#9295B4;
  --line:#E2E4EF;
  --line-2:#CFD2E4;

  /* brand */
  --brand:#4B2FE3;
  --brand-2:#6D4BFF;
  --brand-soft:#EFEBFF;
  --brand-line:#CDC2FF;

  /* semantics — separate from the accent */
  --gold:#E39400;        /* speed, the signature colour */
  --gold-soft:#FFF3DA;
  --gold-line:#F5D08A;
  --ok:#0E8F62;
  --ok-soft:#DFF5EC;
  --bad:#D32F52;
  --bad-soft:#FDE7EC;

  /* answer shapes — deep enough to carry white text */
  --a1:#D62650; --a2:#1B5BDB; --a3:#B96A00; --a4:#0B8C5E; --a5:#6E38CE; --a6:#0A7594;

  --r-s:9px; --r-m:14px; --r-l:20px; --r-xl:28px;
  --sp:clamp(15px,2vw,24px);
  --sh-1:0 1px 2px rgba(22,23,43,.05), 0 2px 6px rgba(22,23,43,.04);
  --sh-2:0 2px 6px rgba(22,23,43,.06), 0 10px 26px rgba(22,23,43,.07);
  --sh-3:0 18px 48px rgba(38,28,110,.16);
  --ring:0 0 0 3px rgba(75,47,227,.20);

  --display:'Archivo','Helvetica Neue',Arial,system-ui,sans-serif;
  --sans:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,Menlo,monospace;
  --dw:700;   /* the display face tops out at 700, so weights refer to it */

  --ease:cubic-bezier(.22,.8,.28,1);
  --spring:cubic-bezier(.34,1.46,.58,1);
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; font-family:var(--sans); color:var(--ink); background:var(--bg);
  background-image:
    radial-gradient(760px 520px at 8% -8%, rgba(109,75,255,.13), transparent 62%),
    radial-gradient(680px 460px at 102% 4%, rgba(14,143,98,.09), transparent 58%),
    radial-gradient(620px 520px at 46% 108%, rgba(227,148,0,.09), transparent 60%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  font-size:15px; line-height:1.5;
}
h1,h2,h3,h4{margin:0; font-family:var(--display); font-weight:var(--dw); line-height:1.1;
  letter-spacing:-.021em; text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none}
a{color:var(--brand)}
::selection{background:rgba(109,75,255,.22)}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}

*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- answer shapes ---------- */
.shp{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.13em}

/* ---------- icons ---------- */
.ico{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.18em;
  fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:1em;height:1em}
.ico.lg{width:1.5em;height:1.5em}
.ico.xl{width:56px;height:56px;stroke-width:1.5}

/* the mark: a Q whose tail is the answer triangle */
.mark{width:1em;height:1em;flex:none;display:block}
.brand{display:inline-flex; align-items:center; gap:10px; font-family:var(--display);
  font-weight:var(--dw); font-size:19px; letter-spacing:-.03em; color:var(--ink)}
.brand .mark{font-size:30px}
.brand small{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);align-self:center}

/* ---------- layout ---------- */
.wrap{width:min(1180px,100%); margin-inline:auto; padding-inline:var(--sp)}
.wrap-wide{width:min(1560px,100%); margin-inline:auto; padding-inline:var(--sp)}
.screen{display:none; min-height:100dvh; flex-direction:column}
.screen.on{display:flex; animation:screen-in .34s var(--ease) both}
@keyframes screen-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.grow{flex:1}
.row{display:flex; align-items:center; gap:11px}
.row.wrap-r{flex-wrap:wrap}
.col{display:flex; flex-direction:column; gap:12px}
.spread{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.hide{display:none !important}
.mono{font-family:var(--mono)}
.dim{color:var(--muted)}
.faint{color:var(--faint)}
.center{text-align:center}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  padding:var(--sp); box-shadow:var(--sh-1)}
.card.tight{padding:15px}
.card.raised{box-shadow:var(--sh-2)}

/* ---------- pills ---------- */
.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px;
  font-size:12.5px; font-weight:600; background:var(--sunken); border:1px solid var(--line);
  color:var(--ink-2); white-space:nowrap; max-width:100%}
.pill .ico{width:14px;height:14px}
.pill.soft{white-space:normal; text-align:left; line-height:1.45}
.pill.ok{color:#07694a; border-color:#A8DEC8; background:var(--ok-soft)}
.pill.warn{color:#8A5A00; border-color:var(--gold-line); background:var(--gold-soft)}
.pill.bad{color:#9C1E3C; border-color:#F3B9C6; background:var(--bad-soft)}
.pill.accent{color:#3A20C0; border-color:var(--brand-line); background:var(--brand-soft)}
.dot{width:7px;height:7px;border-radius:99px;background:currentColor;flex:none}
.dot.live{animation:pulse 1.8s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:12px; font-weight:600; font-size:14.5px;
  background:var(--surface); border:1px solid var(--line-2); color:var(--ink);
  box-shadow:var(--sh-1); line-height:1.15; text-align:center;
  transition:transform .14s var(--ease), box-shadow .18s var(--ease),
             background .16s, border-color .16s, opacity .16s}
.btn:hover{transform:translateY(-1px); box-shadow:var(--sh-2); border-color:var(--line-2)}
.btn:active{transform:translateY(0) scale(.986)}
.btn:disabled{opacity:.42; cursor:not-allowed; transform:none; box-shadow:none}
.btn .ico{opacity:.75}
.btn.primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));
  border-color:transparent; color:#fff; box-shadow:0 1px 2px rgba(38,28,110,.28), 0 8px 20px rgba(75,47,227,.26)}
.btn.primary:hover{box-shadow:0 2px 4px rgba(38,28,110,.3), 0 12px 28px rgba(75,47,227,.34)}
.btn.primary .ico{opacity:1}
.btn.go{background:linear-gradient(180deg,#12A876,#0B7D55); border-color:transparent; color:#fff;
  box-shadow:0 1px 2px rgba(8,70,49,.26), 0 8px 20px rgba(14,143,98,.24)}
.btn.go .ico{opacity:1}
.btn.danger{background:var(--bad-soft); border-color:#F0B3C1; color:#A02040}
.btn.ghost{background:transparent; border-color:var(--line); box-shadow:none}
.btn.ghost:hover{background:var(--surface); box-shadow:var(--sh-1)}
.btn.sm{padding:8px 13px; font-size:13.5px; border-radius:10px}
.btn.xs{padding:5px 9px; font-size:12.5px; border-radius:8px; gap:5px}
.btn.xl{padding:16px 30px; font-size:17px; border-radius:15px; font-family:var(--display); font-weight:var(--dw)}
.btn.block{width:100%}
.btn-ico{width:32px;height:32px;padding:0;border-radius:9px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--surface); border:1px solid var(--line); color:var(--muted);
  transition:.15s var(--ease)}
.btn-ico:hover{background:var(--sunken); color:var(--ink); border-color:var(--line-2)}
.btn-ico.danger:hover{background:var(--bad-soft); color:var(--bad); border-color:#F0B3C1}
.btn-ico .ico{width:16px;height:16px}

/* ---------- fields ---------- */
.field{display:flex; flex-direction:column; gap:6px}
.field > label{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.03em}
.inp{width:100%; padding:11px 13px; border-radius:11px; background:var(--surface);
  border:1px solid var(--line-2); color:var(--ink); outline:none;
  transition:border-color .16s, box-shadow .16s}
.inp:focus{border-color:var(--brand); box-shadow:var(--ring)}
.inp::placeholder{color:var(--faint)}
textarea.inp{resize:vertical; min-height:74px; line-height:1.5}
select.inp{appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 53%,calc(100% - 13px) 53%;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:36px}
input[type=color].inp{padding:3px; height:40px; cursor:pointer}
.inp.err{border-color:var(--bad); box-shadow:0 0 0 3px rgba(211,47,82,.16)}

.switch{display:inline-flex; align-items:center; gap:10px; cursor:pointer; user-select:none}
.switch input{position:absolute; opacity:0; width:0; height:0}
.switch .track{width:44px;height:25px;border-radius:99px;background:var(--line-2);
  position:relative;transition:background .2s var(--ease);flex:none}
.switch .track::after{content:"";position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;
  border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(22,23,43,.28);
  transition:transform .24s var(--spring)}
.switch input:checked + .track{background:var(--brand)}
.switch input:checked + .track::after{transform:translateX(19px)}
.switch input:focus-visible + .track{box-shadow:var(--ring)}

/* ---------- topbar ---------- */
.topbar{position:sticky; top:0; z-index:40; background:rgba(241,242,248,.86);
  backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line)}
.topbar-in{display:flex; align-items:center; gap:12px; padding-block:11px; flex-wrap:wrap}

/* ---------- home ---------- */
.hero{padding-block:clamp(36px,6.5vw,74px)}
.hero h1{font-size:clamp(38px,6.6vw,68px); line-height:1.0; letter-spacing:-.035em}
.hero h1 .grad{background:linear-gradient(96deg,var(--brand-2),var(--brand) 42%,#B03CC8);
  -webkit-background-clip:text; background-clip:text; color:transparent}
.lede{font-size:clamp(15px,1.7vw,18px); color:var(--ink-2); max-width:56ch; line-height:1.6; margin-top:15px}
.rise{animation:rise .6s var(--ease) both}
.rise:nth-child(2){animation-delay:.05s}
.rise:nth-child(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.choice-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:15px; margin-top:32px}
.choice{position:relative; overflow:hidden; text-align:left; padding:22px;
  border-radius:var(--r-xl); border:1px solid var(--line); background:var(--surface);
  box-shadow:var(--sh-1); transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s}
.choice:hover{transform:translateY(-4px); box-shadow:var(--sh-3); border-color:var(--brand-line)}
.choice .badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:var(--brand-soft); color:var(--brand); margin-bottom:13px;
  transition:transform .3s var(--spring), background .22s}
.choice .badge .ico{width:21px;height:21px}
.choice:hover .badge{transform:scale(1.08) rotate(-5deg)}
.choice.b .badge{background:var(--ok-soft); color:var(--ok)}
.choice.c .badge{background:var(--gold-soft); color:#A96E00}
.choice.d .badge{background:var(--bad-soft); color:#B02244}
.choice h3{font-size:20px; margin-bottom:6px}
.choice p{color:var(--muted); font-size:14px; line-height:1.55}
.choice .go-arrow{position:absolute; right:20px; bottom:20px; color:var(--faint);
  opacity:0; transform:translateX(-6px); transition:.24s var(--ease)}
.choice:hover .go-arrow{opacity:1; transform:none; color:var(--brand)}

.feat{display:grid; grid-template-columns:repeat(auto-fit,minmax(206px,1fr)); gap:13px; margin-top:30px}
.feat .f{padding:16px; border-radius:var(--r-m); background:rgba(255,255,255,.66);
  border:1px solid var(--line)}
.feat .f b{display:flex; align-items:center; gap:7px; font-size:13.5px; margin-bottom:5px}
.feat .f b .ico{width:15px;height:15px;color:var(--brand)}
.feat .f span{font-size:13px; color:var(--muted); line-height:1.5}

/* ---------- stepper ---------- */
.steps{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-block:4px 18px}
.step{display:flex; align-items:center; gap:8px; padding:7px 13px; border-radius:999px;
  font-size:13px; font-weight:600; color:var(--faint); background:transparent;
  border:1px solid transparent; transition:.2s var(--ease)}
.step .n{width:20px;height:20px;border-radius:99px;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--line);color:var(--muted);transition:.2s}
.step.done{color:var(--ink-2)}
.step.done .n{background:var(--ok-soft); color:var(--ok)}
.step.done .n .ico{width:12px;height:12px;stroke-width:2.6}
.step.now{color:var(--ink); background:var(--surface); border-color:var(--brand-line); box-shadow:var(--sh-1)}
.step.now .n{background:var(--brand); color:#fff}
.step-sep{color:var(--line-2)}

/* ---------- question editor ---------- */
.editor-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,320px); gap:16px; align-items:start}
@media(max-width:960px){.editor-grid{grid-template-columns:minmax(0,1fr)}}
.qlist{display:flex; flex-direction:column; gap:10px}
.qcard{border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface);
  overflow:hidden; box-shadow:var(--sh-1); transition:border-color .18s, box-shadow .18s}
.qcard:hover{border-color:var(--line-2)}
.qcard.open{border-color:var(--brand-line); box-shadow:var(--sh-2)}
.qhead{display:flex; align-items:center; gap:10px; padding:12px 13px; cursor:pointer; flex-wrap:wrap}
.qnum{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;
  font-size:12.5px;background:var(--sunken);color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.qcard.open .qnum{background:var(--brand); color:#fff}
.qtitle{flex:1 1 150px; min-width:0; font-weight:600; font-size:14.5px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.qtitle.empty{color:var(--faint); font-style:italic; font-weight:400}
.qmeta{display:flex; gap:5px; align-items:center; flex-wrap:wrap; justify-content:flex-end; margin-left:auto}
.qbody{padding:0 13px 15px; display:none; flex-direction:column; gap:13px}
.qcard.open .qbody{display:flex; animation:qopen .28s var(--ease)}
@keyframes qopen{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.opt-rows{display:flex; flex-direction:column; gap:8px}
.opt-row{display:flex; align-items:center; gap:8px}
.opt-shape{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff}
.opt-shape .shp{width:14px;height:14px}
.opt-correct{width:36px;height:32px;flex:none;border-radius:8px;border:1px solid var(--line-2);
  background:var(--surface); display:grid;place-items:center; color:var(--faint); transition:.16s}
.opt-correct .ico{width:16px;height:16px}
.opt-correct:hover{border-color:var(--line-2); color:var(--muted)}
.opt-correct[aria-pressed=true]{background:var(--ok); border-color:var(--ok); color:#fff}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:11px}
@media(max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* ---------- avatars ---------- */
.av{width:1em;height:1em;flex:none;display:block;border-radius:.27em;object-fit:cover;background:var(--sunken)}
.av-xs{font-size:18px} .av-sm{font-size:24px} .av-md{font-size:40px}
.av-lg{font-size:54px} .av-xl{font-size:74px}
.lb-name .av,.speed-row .av,.tick-item .av,.p-chip .av{margin-right:1px}
.av-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:8px;
  max-height:246px; overflow-y:auto; padding:4px; margin:-4px}
.av-opt{padding:4px; border-radius:12px; border:2px solid transparent; background:var(--surface-2);
  display:grid; place-items:center; transition:transform .16s var(--spring), border-color .16s, background .16s}
.av-opt .av{font-size:40px}
.av-opt:hover{transform:translateY(-2px); background:var(--sunken)}
.av-opt[aria-checked=true]{border-color:var(--brand); background:var(--brand-soft);
  box-shadow:var(--ring); transform:translateY(-2px)}
.av-chosen{display:flex; align-items:center; gap:10px}

/* ---------- pre-game briefing ---------- */
.brief{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  padding:17px; box-shadow:var(--sh-1); text-align:left}
.brief-head{display:flex; gap:11px; align-items:flex-start; padding-bottom:13px;
  border-bottom:1px solid var(--line)}
.brief-head .ico{width:19px;height:19px;color:var(--brand);margin-top:1px}
.brief-head b{font-family:var(--display); font-weight:var(--dw); font-size:16px; display:block}
.brief-head p{font-size:13px; color:var(--muted); margin-top:1px}
.brief-stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; padding-block:13px}
@media(max-width:420px){.brief-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.brief-stats > div{display:flex; flex-direction:column; gap:2px; padding:9px 10px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:11px}
.brief-stats .k{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600}
.brief-stats .v{font-family:var(--display); font-weight:var(--dw); font-size:19px;
  font-variant-numeric:tabular-nums; line-height:1.1}
.brief-note{font-size:12.5px; color:var(--muted); padding-bottom:11px; border-bottom:1px solid var(--line)}
.brief-rules{list-style:none; margin:0; padding:13px 0 0; display:flex; flex-direction:column; gap:9px}
.brief-rules li{display:flex; gap:10px; align-items:flex-start; font-size:13.5px;
  line-height:1.5; color:var(--ink-2)}
.brief-rules .ico{width:16px;height:16px;flex:none;margin-top:2px;color:var(--brand)}
.brief-rules b{color:var(--ink); font-weight:600}

/* ---------- question images ---------- */
.qimg-drop{display:flex; align-items:center; gap:10px; width:100%; padding:13px 15px;
  border:1.5px dashed var(--line-2); border-radius:var(--r-m); background:var(--surface-2);
  color:var(--muted); font-size:13.5px; font-weight:600; text-align:left;
  transition:border-color .16s, background .16s, color .16s}
.qimg-drop:hover,.qcard.dragover .qimg-drop{border-color:var(--brand); background:var(--brand-soft); color:var(--brand)}
.qimg-drop .ico{width:19px;height:19px}
.qimg-drop small{display:block; font-weight:400; color:var(--faint); font-size:12px; margin-top:1px}
.qimg-wrap{display:flex; gap:12px; align-items:flex-start}
.qimg-wrap img{width:132px; height:92px; object-fit:cover; border-radius:11px;
  border:1px solid var(--line); background:var(--sunken); flex:none}
.qimg-meta{display:flex; flex-direction:column; gap:7px; min-width:0}
.qimg-meta .sz{font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}
.qimg-busy{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--muted)}
.qimg-busy .ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* the picture as the room sees it */
.qmedia{display:block; margin-inline:auto; max-width:100%; border-radius:var(--r-m);
  border:1px solid var(--line); background:var(--surface); box-shadow:var(--sh-1);
  object-fit:contain; animation:rise .4s var(--ease) both}
.stage .qmedia{max-height:min(38vh,340px)}
.play-body .qmedia{max-height:min(28vh,220px)}
#dash-main .qmedia{max-height:min(34vh,300px)}

/* ---------- teams ---------- */
.team-row{display:flex; align-items:center; gap:9px; padding:9px; border-radius:11px;
  background:var(--surface-2); border:1px solid var(--line)}
.team-chip{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
  font-size:11.5px; font-weight:700; border:1px solid; white-space:nowrap}
.swatch{width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- lobby ---------- */
.lobby-grid{display:grid; grid-template-columns:minmax(0,400px) minmax(0,1fr); gap:16px; align-items:start}
@media(max-width:900px){.lobby-grid{grid-template-columns:minmax(0,1fr)}}
.code-box{text-align:center; padding:24px 20px; border-radius:var(--r-xl);
  background:linear-gradient(168deg,#FFFFFF,var(--brand-soft));
  border:1px solid var(--brand-line); box-shadow:var(--sh-2)}
.code-box .lab{font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
.code-big{font-family:var(--display); font-weight:var(--dw); letter-spacing:.09em;
  font-size:clamp(38px,8.4vw,60px); line-height:1.05; margin:8px 0 4px; color:var(--brand);
  font-variant-numeric:tabular-nums}
.code-big span{display:inline-block; animation:code-in .5s var(--spring) both}
.qr-holder{background:#fff; border-radius:14px; padding:9px; display:inline-block; margin-top:12px;
  line-height:0; border:1px solid var(--line)}
.qr-holder[hidden]{display:none}
.qr-holder img,.qr-holder canvas{display:block; width:146px; height:146px; image-rendering:pixelated}
@keyframes code-in{from{opacity:0;transform:translateY(-14px) rotate(-8deg)}to{opacity:1;transform:none}}

.player-grid{display:flex; flex-wrap:wrap; gap:8px}
.p-chip{display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line); font-size:13.5px; font-weight:600;
  box-shadow:var(--sh-1); animation:pop .4s var(--spring)}
.p-chip .x{opacity:.4; display:inline-flex; padding-left:1px}
.p-chip .x .ico{width:13px;height:13px}
.p-chip .x:hover{opacity:1; color:var(--bad)}
.p-chip.off{opacity:.5}
.p-chip.sel{border-color:var(--brand); box-shadow:var(--ring)}
@keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
.empty-state{padding:32px 16px; text-align:center; color:var(--faint); font-size:13.5px}

/* ---------- notice ---------- */
.notice{display:flex; gap:12px; align-items:flex-start; padding:14px 16px; margin-bottom:14px;
  border-radius:var(--r-m); border:1px solid var(--gold-line); background:var(--gold-soft);
  font-size:13.5px; line-height:1.6; color:#6E4A00; animation:rise .4s var(--ease) both}
.notice.stop{border-color:#F3B9C6; background:var(--bad-soft); color:#8C1B36}
.notice .ic{flex:none; color:currentColor}
.notice .ic .ico{width:19px;height:19px}
.notice b{display:block; font-size:14.5px; margin-bottom:3px; color:var(--ink)}
.notice p{color:inherit; opacity:.92}
.notice code,.notice .mono{font-family:var(--mono); font-size:12.5px; background:rgba(0,0,0,.06);
  padding:1px 5px; border-radius:5px}

/* ---------- stage ---------- */
.stage{flex:1; display:flex; flex-direction:column; gap:14px; padding-block:16px}
.stage-top{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
.qtext{font-family:var(--display); font-size:clamp(23px,4.3vw,50px); font-weight:var(--dw); text-align:center;
  line-height:1.14; letter-spacing:-.028em; padding:clamp(18px,3vw,32px) clamp(16px,3vw,28px);
  border-radius:var(--r-xl); background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--sh-2); animation:q-in .45s var(--ease) both}
@keyframes q-in{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}

.answers{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
.answers.one-col{grid-template-columns:minmax(0,1fr)}
@media(max-width:600px){.answers{grid-template-columns:minmax(0,1fr)}}
.ans{position:relative; display:flex; align-items:center; gap:13px; text-align:left;
  padding:clamp(14px,2.3vw,22px); border-radius:var(--r-m); font-weight:600;
  font-size:clamp(15px,2vw,21px); color:#fff; border:0; overflow:hidden; min-height:72px;
  box-shadow:var(--sh-2);
  transition:transform .14s var(--ease), filter .18s, opacity .3s, box-shadow .2s}
/* Only the first sight of a question deals the tiles in; the reveal keeps them
   exactly where the room is already looking. */
.answers.deal .ans{animation:ans-in .4s var(--spring) both}
.answers.deal .ans:nth-child(1){animation-delay:.03s} .answers.deal .ans:nth-child(2){animation-delay:.09s}
.answers.deal .ans:nth-child(3){animation-delay:.15s} .answers.deal .ans:nth-child(4){animation-delay:.21s}
.answers.deal .ans:nth-child(5){animation-delay:.27s} .answers.deal .ans:nth-child(6){animation-delay:.33s}
@keyframes ans-in{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.ans:not(:disabled):hover{transform:translateY(-3px); filter:brightness(1.08); box-shadow:var(--sh-3)}
.ans:not(:disabled):active{transform:translateY(0) scale(.985)}
.ans:disabled{cursor:default}
.ans .shape{width:36px;height:36px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.2); border-radius:10px}
.ans .shape .shp{width:16px;height:16px}
.ans .txt{flex:1; min-width:0; overflow-wrap:anywhere}
.ans .tick{flex:none; display:inline-flex}
.ans .tick .ico{width:24px;height:24px;stroke-width:2.6}
.ans.dimmed{opacity:.38; box-shadow:var(--sh-1)}
.ans.right{box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--ok), var(--sh-3); opacity:1; filter:none;
  animation:right-pop .5s var(--spring)}
@keyframes right-pop{0%{transform:scale(1)}42%{transform:scale(1.035)}100%{transform:scale(1)}}
.ans.wrongpick{box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--bad), var(--sh-2)}
.ans.picked{box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--ink), var(--sh-2)}
.ans .barfill{position:absolute; inset:auto 0 0 0; height:5px; background:rgba(255,255,255,.9);
  width:0; transition:width .8s var(--ease) .15s}

/* countdown */
.timer{display:flex; align-items:center; gap:12px}
.ring{position:relative; width:70px; height:70px; flex:none}
.ring svg{transform:rotate(-90deg); display:block}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--brand); transition:stroke-dashoffset .25s linear, stroke .3s}
.ring.low .fgc{stroke:var(--gold)}
.ring.crit .fgc{stroke:var(--bad)}
.ring .num{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--display);
  font-weight:var(--dw); font-size:23px; font-variant-numeric:tabular-nums}
.ring.crit .num{color:var(--bad); animation:tick .55s var(--spring) infinite}
@keyframes tick{0%,100%{transform:scale(1)}45%{transform:scale(1.16)}}
.answered-count{font-family:var(--display); font-size:clamp(19px,2.8vw,28px); font-weight:var(--dw);
  font-variant-numeric:tabular-nums}

/* ---------- fastest ---------- */
.fastest{display:flex; align-items:center; gap:15px; padding:17px 20px; border-radius:var(--r-l);
  background:linear-gradient(102deg,var(--gold-soft),#FFFDF7 62%);
  border:1px solid var(--gold-line); box-shadow:var(--sh-2); position:relative; overflow:hidden;
  animation:fast-in .5s var(--ease) both}
@keyframes fast-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fastest::after{content:""; position:absolute; inset:0;
  background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.5) 48%,transparent 62%);
  transform:translateX(-100%); animation:sheen 1.25s .3s var(--ease); pointer-events:none}
@keyframes sheen{to{transform:translateX(100%)}}
.fastest .bolt{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--gold); color:#fff; box-shadow:0 6px 16px rgba(227,148,0,.42);
  animation:zap 2.2s var(--ease) infinite}
.fastest .bolt .ico{width:22px;height:22px}
@keyframes zap{0%,100%{transform:scale(1) rotate(0)}44%{transform:scale(1.1) rotate(-7deg)}}
.fastest .who{font-family:var(--display); font-size:clamp(20px,3.2vw,30px); font-weight:var(--dw);
  line-height:1.1; letter-spacing:-.028em}
.fastest .lab{font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:#946200}
.fastest .secs{font-family:var(--mono); font-weight:600; font-size:clamp(24px,4vw,40px); letter-spacing:-.02em;
  color:var(--gold); font-variant-numeric:tabular-nums; margin-left:auto; text-align:right; line-height:1}
.fastest .secs small{display:block; font-size:10.5px; letter-spacing:.16em; color:var(--faint);
  font-family:var(--sans); font-weight:700; margin-top:5px}

.speed-list{display:flex; flex-direction:column; gap:7px}
.speed-row{display:flex; align-items:center; gap:10px; padding:8px 11px; border-radius:11px;
  background:var(--surface-2); border:1px solid var(--line); font-size:13.5px;
  animation:slide-in .4s var(--ease) both}
.speed-row:nth-child(2){animation-delay:.05s} .speed-row:nth-child(3){animation-delay:.1s}
.speed-row:nth-child(4){animation-delay:.15s} .speed-row:nth-child(5){animation-delay:.2s}
.rank-badge{width:22px;height:22px;border-radius:99px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:var(--dw);background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.rank-badge.g1{background:linear-gradient(160deg,#FFD772,#E39400);color:#553600;box-shadow:0 2px 6px rgba(227,148,0,.4)}
.rank-badge.g2{background:linear-gradient(160deg,#E6E9F2,#B4BACB);color:#3C4257}
.rank-badge.g3{background:linear-gradient(160deg,#EFC08E,#C2803F);color:#4A2C0B}
.speed-row .nm{flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.speed-row .tm{font-family:var(--mono); font-weight:600; font-size:13px; color:var(--brand); font-variant-numeric:tabular-nums}
.speed-row.me{border-color:var(--brand-line); background:var(--brand-soft)}

/* ---------- leaderboard ---------- */
.lb{display:flex; flex-direction:column; gap:6px}
.lb-row{display:grid; grid-template-columns:30px minmax(0,1fr) auto; align-items:center; gap:11px;
  padding:9px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--sh-1); position:relative; overflow:hidden}
.lb-row .rk{font-family:var(--display); font-weight:var(--dw); font-size:15px; color:var(--faint);
  text-align:center; font-variant-numeric:tabular-nums}
.lb-row.top1{background:linear-gradient(100deg,var(--gold-soft),#FFFEFA); border-color:var(--gold-line)}
.lb-row.top1 .rk{color:var(--gold)}
.lb-row.top2{background:linear-gradient(100deg,#F2F4F9,#FFF); border-color:var(--line-2)}
.lb-row.top3{background:linear-gradient(100deg,#FBF0E4,#FFF); border-color:#E8CBA8}
.lb-row.me{border-color:var(--brand); box-shadow:var(--ring)}
.lb-name{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:7px; min-width:0}
.lb-name > span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lb-score{font-family:var(--display); font-weight:var(--dw); font-size:16px; font-variant-numeric:tabular-nums}
.lb-delta{font-size:11.5px; font-weight:700}
.lb-sub{font-size:11.5px; color:var(--faint)}
/* rows physically swap places when the ranking changes */
.lb-row.moving{z-index:2; box-shadow:var(--sh-3)}

/* ---------- team race ---------- */
.team-bar{display:flex; flex-direction:column; gap:5px}
.team-bar .lbl{display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px;
  font-weight:600; gap:10px; flex-wrap:wrap}
.team-bar .track{height:14px; border-radius:99px; background:var(--sunken); overflow:hidden}
.team-bar .fill{height:100%; border-radius:99px; width:0; transition:width 1s var(--ease)}

/* ---------- distribution ---------- */
.dist{display:flex; flex-direction:column; gap:9px}
.dist-row{display:grid; grid-template-columns:30px minmax(0,1fr) 68px; align-items:center; gap:10px}
.dist-row .sh{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff}
.dist-row .sh .shp{width:13px;height:13px}
.dist-row .tr{height:30px; border-radius:9px; background:var(--sunken); overflow:hidden; position:relative}
.dist-row .fl{height:100%; width:0; border-radius:9px; transition:width .9s var(--ease) .1s}
.dist-row .cap{position:absolute; inset:0; display:flex; align-items:center; padding-inline:10px;
  font-size:13px; font-weight:600; gap:6px}
.dist-row .cap .ico{width:14px;height:14px;color:var(--ok);stroke-width:2.8}
.dist-row .n{text-align:right; font-weight:700; font-size:13px; font-variant-numeric:tabular-nums; color:var(--muted)}

/* ---------- dashboard ---------- */
.dash-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(292px,1fr)); gap:14px; align-items:start}
.stat-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:11px}
.tile{padding:14px 15px; border-radius:var(--r-m); background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--sh-1)}
.tile .k{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); font-weight:700}
.tile .v{font-family:var(--display); font-size:clamp(21px,3vw,29px); font-weight:var(--dw); margin-top:4px;
  font-variant-numeric:tabular-nums; line-height:1.08}
.tile .s{font-size:12px; color:var(--muted); margin-top:2px}
.ticker{display:flex; flex-direction:column; gap:6px; max-height:264px; overflow:auto}
.tick-item{display:flex; align-items:center; gap:9px; padding:7px 11px; border-radius:10px; font-size:13px;
  background:var(--surface-2); border:1px solid var(--line); animation:slide-in .35s var(--ease)}
@keyframes slide-in{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
.tick-item .ico{width:15px;height:15px}
.tick-item .t{margin-left:auto; font-family:var(--mono); font-weight:600; font-size:12.5px; font-variant-numeric:tabular-nums}
.tick-item.good .ico{color:var(--ok)} .tick-item.good .t{color:var(--ok)}
.tick-item.bad-a{opacity:.66} .tick-item.bad-a .ico{color:var(--bad)}

/* ---------- podium ---------- */
.podium{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; align-items:end; margin-block:18px}
@media(max-width:600px){.podium{grid-template-columns:minmax(0,1fr)}}
.pod{display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 12px;
  border-radius:var(--r-l) var(--r-l) 8px 8px; border:1px solid var(--line); background:var(--surface);
  text-align:center; box-shadow:var(--sh-2); animation:pod-up .6s var(--spring) both}
.pod .cr{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-weight:var(--dw);
  font-family:var(--display); font-size:15px}
.pod .nm{font-family:var(--display); font-weight:var(--dw); font-size:clamp(16px,2.2vw,21px); word-break:break-word}
.pod .sc{font-family:var(--display); font-weight:var(--dw); font-size:19px; font-variant-numeric:tabular-nums}
.pod.p1{min-height:216px; background:linear-gradient(180deg,var(--gold-soft),#fff);
  border-color:var(--gold-line); order:2; animation-delay:.14s}
.pod.p1 .cr{background:linear-gradient(160deg,#FFD772,#E39400);color:#553600}
.pod.p2{min-height:176px; background:linear-gradient(180deg,#F1F3F9,#fff); order:1; animation-delay:.05s}
.pod.p2 .cr{background:linear-gradient(160deg,#E6E9F2,#B4BACB);color:#3C4257}
.pod.p3{min-height:148px; background:linear-gradient(180deg,#FBF0E4,#fff); border-color:#E8CBA8; order:3; animation-delay:.22s}
.pod.p3 .cr{background:linear-gradient(160deg,#EFC08E,#C2803F);color:#4A2C0B}
@keyframes pod-up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@media(max-width:600px){.pod.p1,.pod.p2,.pod.p3{order:0; min-height:0}}

/* ---------- table ---------- */
.tbl-scroll{overflow-x:auto; border-radius:var(--r-m); border:1px solid var(--line); background:var(--surface)}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px; min-width:620px}
table.tbl th{text-align:left; padding:10px 13px; font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); background:var(--surface-2); font-weight:700; white-space:nowrap; position:sticky; top:0}
table.tbl td{padding:10px 13px; border-top:1px solid var(--line); white-space:nowrap}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl td.num{font-variant-numeric:tabular-nums}

/* ---------- player device ---------- */
.play-shell{min-height:100dvh; display:flex; flex-direction:column}
.play-head{display:flex; align-items:center; gap:10px; padding:10px var(--sp);
  border-bottom:1px solid var(--line); background:rgba(255,255,255,.8);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); flex-wrap:wrap}
.play-body{flex:1; display:flex; flex-direction:column; gap:13px; padding:var(--sp); justify-content:center}

/* Copy protection. Applied to the player screen and the projector dashboard
   when the host leaves it on: text cannot be selected, dragged or long-pressed,
   and the picture cannot be dragged out of the page. Buttons still work. */
.no-copy, .no-copy *{user-select:none; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent}
.no-copy ::selection{background:transparent}
.no-copy ::-moz-selection{background:transparent}
.no-copy img{-webkit-user-drag:none; pointer-events:none}
#play-name{display:inline-flex; align-items:center; gap:8px; min-width:0}
#play-name > span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.me-score{margin-left:auto; font-family:var(--display); font-weight:var(--dw); font-size:17px; font-variant-numeric:tabular-nums}
.verdict{display:flex; flex-direction:column; align-items:center; gap:11px; text-align:center;
  padding:clamp(24px,5.5vw,42px) 20px; border-radius:var(--r-xl); border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--sh-2); animation:rise .42s var(--ease) both}
.verdict.good{background:linear-gradient(170deg,var(--ok-soft),#fff); border-color:#A8DEC8}
.verdict.bad{background:linear-gradient(170deg,var(--bad-soft),#fff); border-color:#F3B9C6}
.verdict .em{width:74px;height:74px;border-radius:99px;display:grid;place-items:center;
  background:var(--sunken); color:var(--muted); animation:pop .5s var(--spring)}
.verdict .em .ico{width:38px;height:38px;stroke-width:1.8}
.verdict.good .em{background:var(--ok); color:#fff; box-shadow:0 8px 22px rgba(14,143,98,.34)}
.verdict.bad .em{background:var(--bad); color:#fff; box-shadow:0 8px 22px rgba(211,47,82,.3)}
.verdict.gold .em{background:var(--gold); color:#fff; box-shadow:0 8px 22px rgba(227,148,0,.38)}
.verdict h2{font-size:clamp(24px,5.5vw,38px)}
.verdict .pts{font-family:var(--display); font-size:clamp(22px,5vw,34px); font-weight:var(--dw); color:var(--brand)}
.waitdots::after{content:""; animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ---------- misc ---------- */
.toast-host{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:200;
  display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(430px,92vw)}
.toast{display:flex; align-items:center; gap:9px; padding:11px 16px; border-radius:12px; font-size:13.5px;
  font-weight:600; width:100%; background:var(--ink); color:#fff; box-shadow:var(--sh-3);
  animation:toastin .32s var(--spring)}
.toast .ico{width:16px;height:16px;flex:none}
.toast.ok .ico{color:#5BE0AB} .toast.bad .ico{color:#FF8FA8}
@keyframes toastin{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}

.modal-bg{position:fixed; inset:0; z-index:150; background:rgba(22,23,43,.34);
  backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:18px}
.modal-bg.on{display:flex; animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(520px,100%); max-height:86dvh; overflow:auto; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r-l); padding:22px; box-shadow:var(--sh-3);
  animation:modal-in .3s var(--spring)}
@keyframes modal-in{from{transform:translateY(18px) scale(.97);opacity:0}to{transform:none;opacity:1}}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:120}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
}
@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .card,.tile,.lb-row,.pod{box-shadow:none}
}

/* ============================================================
   PUZZLES
   Boards keep the app's paper and ink but drop the card chrome:
   a puzzle wants a quiet frame and one confident mark. Each board
   is a CSS grid whose 1px gaps ARE the rules, with an SVG laid
   over it on a viewBox of cell units — so a stroke at 3.5 lands
   dead centre of the fourth cell at any size, on any screen.
   ============================================================ */
:root{
  /* ten hues that stay apart on paper and carry white text */
  --p0:#D62650; --p1:#1B5BDB; --p2:#B96A00; --p3:#0B8C5E; --p4:#6E38CE;
  --p5:#0A7594; --p6:#C2410C; --p7:#A32FB0; --p8:#4F7A0B; --p9:#B01457;
}

/* ---- the hub ---- */
.pz-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));
  gap:14px; margin-top:20px}
.pz-tile{display:flex; flex-direction:column; align-items:flex-start; gap:9px; text-align:left;
  padding:20px; border-radius:var(--r-l); border:1px solid var(--line); background:var(--surface);
  box-shadow:var(--sh-1); cursor:pointer; font:inherit; color:inherit;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease)}
.pz-tile:hover{transform:translateY(-3px); box-shadow:var(--sh-2); border-color:var(--line-2)}
.pz-tile .badge{width:42px; height:42px; border-radius:13px; display:grid; place-items:center;
  background:var(--brand-soft); color:var(--brand); border:1px solid var(--brand-line)}
.pz-tile .badge .ico{width:22px; height:22px}
.pz-tile h3{font-family:var(--display); font-weight:var(--dw); font-size:20px}
.pz-tile p{font-size:13.5px; color:var(--muted); line-height:1.55}
.pz-tile .best{margin-top:2px; font-family:var(--mono); font-size:12.5px; color:var(--faint);
  font-variant-numeric:tabular-nums}
.pz-tile:nth-child(2) .badge{background:var(--gold-soft); color:#8A5A00; border-color:var(--gold-line)}
.pz-tile:nth-child(3) .badge{background:var(--ok-soft); color:#07694a; border-color:#A8DEC8}
.pz-tile:nth-child(4) .badge{background:var(--bad-soft); color:#9C1E3C; border-color:#F3B9C6}

/* ---- board chrome ---- */
.pz-shell{flex:1; display:flex; flex-direction:column; align-items:center;
  padding:14px var(--sp) 44px; gap:13px}
.pz-top{width:min(600px,100%); display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.pz-top .grow{flex:1}
.pz-clock{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-weight:600;
  font-size:18px; font-variant-numeric:tabular-nums; color:var(--ink)}
.pz-clock .ico{width:16px; height:16px; color:var(--muted)}
.pz-clock.low{color:var(--bad)}
.pz-clock.low .ico{color:var(--bad)}
.pz-levels{display:inline-flex; padding:3px; gap:2px; background:var(--sunken);
  border:1px solid var(--line); border-radius:11px}
.pz-levels button{font:inherit; font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:8px;
  border:0; background:transparent; color:var(--muted); cursor:pointer}
.pz-levels button.on{background:var(--surface); color:var(--ink); box-shadow:var(--sh-1)}

.pz-board{width:min(600px,100%); aspect-ratio:1; position:relative; border-radius:var(--r-l);
  background:var(--line); border:1px solid var(--line-2); box-shadow:var(--sh-2);
  overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent}
.pz-cells{position:absolute; inset:0; display:grid; gap:1px}
.pz-cell{position:relative; display:flex; align-items:center; justify-content:center;
  background:var(--surface); font-family:var(--display); font-weight:var(--dw);
  font-size:clamp(15px,4.4vw,30px); color:var(--ink); line-height:1;
  transition:background .16s var(--ease), color .16s var(--ease)}
.pz-svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
/* the slots under the board share the board's width and take no room when
   they hold nothing, so the rules sit right beneath the grid */
#pz-race, #pz-extra, #pz-finish{width:min(600px,100%); display:flex; flex-direction:column;
  align-items:center}
#pz-race:empty, #pz-extra:empty, #pz-finish:empty, .pz-note:empty{display:none}
.pz-rule{width:min(600px,100%); font-size:13.5px; color:var(--muted); line-height:1.6}
.pz-rule b{color:var(--ink-2)}
.pz-note{width:min(600px,100%); display:flex; align-items:center; gap:8px; font-size:13px;
  color:var(--muted); min-height:20px}
.pz-note .ico{width:15px; height:15px; flex:none}
.pz-note.good{color:#07694a}
.pz-note.bad{color:#9C1E3C}

.pz-done{width:min(600px,100%); display:flex; align-items:center; gap:12px; padding:14px 16px;
  border-radius:var(--r-m); background:linear-gradient(170deg,var(--ok-soft),#fff);
  border:1px solid #A8DEC8; animation:rise .42s var(--ease) both}
.pz-done .em{width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
  background:#fff; color:#07694a; border:1px solid #A8DEC8; flex:none}
.pz-done b{font-family:var(--display); font-weight:var(--dw); font-size:17px}
.pz-done .t{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:20px; color:#07694a}

/* ---- Zip ---- */
.zip-stop{width:74%; height:74%; border-radius:50%; background:var(--ink); color:#fff;
  display:grid; place-items:center; font-size:.82em; z-index:2; position:relative}
.pz-cell.zip-first{background:#CFE6F8}
.pz-cell.zip-on{background:var(--brand-soft)}

/* ---- Wend ---- */
.pz-cell.wend-block{background:var(--line-2)}
.pz-cell.wend-done{color:#fff}
.pz-cell.wend-live{background:var(--brand-soft); color:var(--brand)}
.wend-bank{width:100%; display:flex; flex-wrap:wrap; gap:9px; justify-content:center}
.wend-slot{display:flex; gap:3px; padding:5px; border-radius:9px; background:var(--sunken);
  border:1px solid var(--line)}
.wend-slot i{width:13px; height:13px; border-radius:3px; background:var(--line-2); display:block}
.wend-slot.filled{border-color:transparent}
.wend-slot.filled i{background:currentColor}
.wend-slot b{font-style:normal; font-family:var(--mono); font-size:12px; align-self:center;
  padding:0 5px; color:currentColor; letter-spacing:.04em}

/* ---- Patches ---- */
.patch-seed{width:70%; height:70%; border-radius:9px; display:grid; place-items:center;
  color:#fff; font-size:.8em; z-index:2; position:relative; box-shadow:var(--sh-1)}
.pz-cell.patch-live{outline:2px dashed var(--brand); outline-offset:-3px}

/* ---- Mini Sudoku ---- */
.pz-cell.sud-given{color:var(--ink)}
.pz-cell.sud-mine{color:var(--brand)}
.pz-cell.sud-sel{background:var(--brand-soft)}
.pz-cell.sud-peer{background:var(--surface-2)}
.pz-cell.sud-clash{color:var(--bad); background:var(--bad-soft)}
.sud-pad{width:100%; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:7px}
.sud-pad button{font-family:var(--display); font-weight:var(--dw); font-size:20px; padding:12px 0;
  border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  cursor:pointer; box-shadow:var(--sh-1); transition:transform .14s var(--ease)}
.sud-pad button:hover{border-color:var(--line-2); transform:translateY(-1px)}
.sud-pad button:active{transform:translateY(0) scale(.96)}
.sud-pad button.clear{font-size:14px; font-family:var(--sans); color:var(--muted)}
.sud-pad button.spent{opacity:.34}

/* ---- race strip, shown when a host is running the puzzle live ---- */
.pz-race{width:min(600px,100%); display:flex; flex-direction:column; gap:8px; padding:13px 15px;
  border-radius:var(--r-m); border:1px solid var(--brand-line); background:var(--brand-soft)}
.pz-race .hd{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:650; color:#3A20C0}
.pz-race .lb{gap:5px}
.pz-race .lb-row{padding:7px 10px}
/* in a race the host owns the board and the level — hide what would only
   take a player out of it */
#s-puzzle.racing .pz-levels, #s-puzzle.racing #pz-nav{display:none}

@media (max-width:560px){
  .pz-board{width:100%}
  .sud-pad{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
